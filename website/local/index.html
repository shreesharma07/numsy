<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Numsy Dashboard</title>
    <meta name="description" content="Local Numsy dashboard: validate, de-duplicate and export Indian mobile numbers on this computer." />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../public/brand/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const t = localStorage.getItem('numsy-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The Numsy dashboard needs JavaScript. The CLI works without it: run <code>numsy --help</code>.</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
