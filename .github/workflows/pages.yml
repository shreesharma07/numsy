name: Deploy website to GitHub Pages

# Builds website/ (Vite + React) and publishes website/dist to GitHub Pages.
# Requires: Settings → Pages → Build and deployment → Source = "GitHub Actions".
# All actions are pinned to full commit SHAs (tag in the trailing comment).

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'assets/brand/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Nothing by default; each job requests only what it needs.
permissions: {}

# One deployment at a time; don't cancel a run that is already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in the root package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile --filter @numsy/website...

      - name: Build website
        run: pnpm --filter @numsy/website build

      # No actions/configure-pages: it needs a Pages API token and its outputs (base path)
      # are unused — the base is fixed in website/vite.config.ts.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
